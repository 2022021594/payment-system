services:
  postgres:
    image: postgres:17
    container_name: payment-postgres
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      TZ: UTC
    ports:
      # 로컬에 설치된 PostgreSQL(5432)과 충돌하지 않도록 호스트 포트는 5433 사용
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
